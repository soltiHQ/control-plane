name: Checks

on:
  workflow_call: {}

jobs:
  fumpt:
    runs-on: ${{ vars.RUNS_ON }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cache
      - name: Run ci/fumpt
        uses: soltiHQ/actions/taskfile@main
        with: { command: ci/fumpt }

  lint:
    runs-on: ${{ vars.RUNS_ON }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cache
      - name: Run ci/lint
        uses: soltiHQ/actions/taskfile@main
        with: { command: ci/lint }

  test:
    runs-on: ${{ vars.RUNS_ON }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cache
      - name: Run ci/test
        uses: soltiHQ/actions/taskfile@main
        with: { command: ci/test }

  vulnerability:
    runs-on: ${{ vars.RUNS_ON }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cache
      - name: Run ci/vulnerability
        uses: soltiHQ/actions/taskfile@main
        with: { command: ci/vulnerability }
