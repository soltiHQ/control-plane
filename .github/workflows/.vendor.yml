name: Vendor

on:
  workflow_call: {}

jobs:
  vendor:
    runs-on: ${{ vars.RUNS_ON }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache
        id: cache
        uses: ./.github/actions/cache

      - name: Run vendor
        if: steps.cache.outputs.cache-hit != 'true'
        uses: soltiHQ/actions/taskfile@main
        with:
          command: ci/vendor
