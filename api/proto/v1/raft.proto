syntax = "proto3";

package solti.raft.v1;

option go_package = "github.com/soltiHQ/control-plane/api/gen/v1;genv1";

import "google/protobuf/struct.proto";

// Command is the unit of log entry submitted to Raft. One command maps to
// one atomic transaction applied by the FSM on every replica.
message Command {
  repeated Op ops = 1;
}

// Op carries one mutation. The oneof discriminates the variant; the FSM
// type-switches on (*Op).GetOp() to dispatch.
//
// String-only fields (e.g. agent_delete = 2) carry just the target ID for
// the matching delete variant. Reserve unused numbers via `reserved` if a
// variant is ever retired so the slot can never silently come back.
message Op {
  oneof op {
    AgentMsg                agent_upsert                = 1;
    string                  agent_delete                = 2;

    UserMsg                 user_upsert                 = 3;
    string                  user_delete                 = 4;

    RoleMsg                 role_upsert                 = 5;
    string                  role_delete                 = 6;

    CredentialMsg           credential_upsert           = 7;
    string                  credential_delete           = 8;

    VerifierMsg             verifier_upsert             = 9;
    string                  verifier_delete             = 10;
    string                  verifier_delete_by_cred     = 11;

    SessionMsg              session_create              = 12;
    string                  session_delete              = 13;
    string                  session_delete_by_user      = 14;
    SessionRotateRefreshMsg session_rotate_refresh      = 15;
    SessionRevokeMsg        session_revoke              = 16;

    SpecMsg                 spec_upsert                 = 17;
    string                  spec_delete                 = 18;

    RolloutMsg              rollout_upsert              = 19;
    string                  rollout_delete              = 20;
    string                  rollout_delete_by_spec      = 21;

    string                  event_notify                = 22;
    EventRecordMsg          event_record                = 23;
    EventDeleteIssuesMsg    event_delete_issues         = 24;
  }
}

// SessionRotateRefreshMsg carries the parameters for the rotate-refresh op.
message SessionRotateRefreshMsg {
  string id            = 1;
  bytes  refresh_hash  = 2;
  int64  expires_at_ns = 3;
}

// SessionRevokeMsg carries the parameters for the revoke-session op.
message SessionRevokeMsg {
  string id            = 1;
  int64  revoked_at_ns = 2;
}

// EventPayloadMsg mirrors internal/event.Payload.
message EventPayloadMsg {
  string id     = 1;
  string by     = 2;
  string name   = 3;
  string detail = 4;
}

// EventRecordMsg replicates a single ring-buffer entry.
message EventRecordMsg {
  string          kind    = 1;
  EventPayloadMsg payload = 2;
}

// EventDeleteIssuesMsg drops matching entries from the issues ring.
message EventDeleteIssuesMsg {
  string kind = 1;
  string id   = 2;
}

// AgentMsg mirrors domain/model.Agent for replication. Time values are
// nanoseconds since the Unix epoch so the proto is timezone-free.
message AgentMsg {
  string id            = 1;
  string name          = 2;
  string endpoint      = 3;
  string endpoint_type = 4;
  uint32 api_version   = 5;
  string os            = 6;
  string arch          = 7;
  string platform      = 8;

  int64 uptime_seconds        = 9;
  int64 heartbeat_interval_ns = 10;
  uint32 status               = 11;

  int64 created_at_ns   = 12;
  int64 updated_at_ns   = 13;
  int64 last_seen_at_ns = 14;
  int64 stale_at_ns     = 15;

  map<string, string> metadata     = 16;
  map<string, string> labels       = 17;
  repeated string     capabilities = 18;
}

// UserMsg mirrors domain/model.User for replication.
message UserMsg {
  string id       = 1;
  string subject  = 2;
  string email    = 3;
  string name     = 4;
  bool   disabled = 5;

  repeated string role_ids    = 6;
  repeated string permissions = 7;

  int64 created_at_ns = 8;
  int64 updated_at_ns = 9;
}

// RoleMsg mirrors domain/model.Role for replication.
message RoleMsg {
  string id   = 1;
  string name = 2;

  repeated string permissions = 3;

  int64 created_at_ns = 4;
  int64 updated_at_ns = 5;
}

// CredentialMsg mirrors domain/model.Credential for replication.
message CredentialMsg {
  string id      = 1;
  string user_id = 2;
  string auth    = 3;

  map<string, string> secrets = 4;

  int64 created_at_ns = 5;
  int64 updated_at_ns = 6;
}

// VerifierMsg mirrors domain/model.Verifier for replication.
message VerifierMsg {
  string id            = 1;
  string credential_id = 2;
  string auth          = 3;

  map<string, string> data = 4;

  int64 created_at_ns = 5;
  int64 updated_at_ns = 6;
}

// SessionMsg mirrors domain/model.Session for replication.
message SessionMsg {
  string id            = 1;
  string user_id       = 2;
  string credential_id = 3;
  string auth          = 4;
  bytes  refresh_hash  = 5;

  int64 expires_at_ns = 6;
  int64 revoked_at_ns = 7;
  int64 created_at_ns = 8;
  int64 updated_at_ns = 9;
}

// BackoffMsg mirrors domain/model.BackoffConfig for replication.
message BackoffMsg {
  string jitter   = 1;
  int64  first_ms = 2;
  int64  max_ms   = 3;
  double factor   = 4;
}

// SpecMsg mirrors domain/model.Spec for replication. KindConfig is
// google.protobuf.Struct (arbitrary JSON-like nested data) because the
// model intentionally lets each task kind define its own config schema.
message SpecMsg {
  string id   = 1;
  string name = 2;
  string slot = 3;

  int32 version    = 4;
  int32 generation = 5;
  bool deletion_requested = 6;

  string                  kind_type   = 7;
  google.protobuf.Struct  kind_config = 8;

  int64      timeout_ms   = 9;
  string     restart_type = 10;
  int64      interval_ms  = 11;
  BackoffMsg backoff      = 12;

  repeated string     targets       = 13;
  map<string, string> target_labels = 14;
  map<string, string> runner_labels = 15;

  int64 created_at_ns = 16;
  int64 updated_at_ns = 17;
}

// RolloutMsg mirrors domain/model.Rollout for replication.
message RolloutMsg {
  string id             = 1;
  string spec_id        = 2;
  string agent_id       = 3;
  string actual_task_id = 4;
  string err_msg        = 5;

  int32 desired_generation  = 6;
  int32 observed_generation = 7;
  int32 attempts            = 8;

  uint32 status = 9;
  uint32 intent = 10;

  int64 created_at_ns      = 11;
  int64 updated_at_ns      = 12;
  int64 last_pushed_at_ns  = 13;
  int64 last_synced_at_ns  = 14;
}

// Snapshot is the full FSM state serialised for Raft log compaction.
// Encoded as a single proto blob by FSM.Snapshot and read back by
// FSM.Restore. Header.Magic guards against feeding random files in;
// Header.Version bumps when the layout becomes incompatible.
message Snapshot {
  SnapshotHeader header = 1;

  repeated AgentMsg      agents      = 2;
  repeated UserMsg       users       = 3;
  repeated RoleMsg       roles       = 4;
  repeated CredentialMsg credentials = 5;
  repeated VerifierMsg   verifiers   = 6;
  repeated SessionMsg    sessions    = 7;
  repeated SpecMsg       specs       = 8;
  repeated RolloutMsg    rollouts    = 9;
}

message SnapshotHeader {
  string magic   = 1;
  uint32 version = 2;
}
